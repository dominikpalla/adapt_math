<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdaptMath - Iframe Demo s OLM</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; border: 1px solid #e0e0e0; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .task-box { background-color: #f8f9fa; padding: 25px; border-left: 5px solid #f37021; margin-bottom: 25px; font-size: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #444; }
        input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        input[type="range"] { width: 100%; }

        /* Styl pro Checkbox sekci */
        .checkbox-group { display: flex; align-items: center; gap: 10px; background-color: #f1f1f1; padding: 12px; border-radius: 6px; margin-top: 10px; }

        /* Styly pro tlačítka */
        button { border: none; padding: 15px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s; }
        .btn-main { background-color: #f37021; color: white; margin-top: 10px; }
        .btn-main:hover { background-color: #d95e16; }
        .btn-hint { background-color: #6c757d; color: white; margin-bottom: 15px; }
        .btn-hint:hover { background-color: #5a6268; }

        /* Styl pro nápovědu */
        .hint-box { display: none; background: #e7f3ff; padding: 15px; border-radius: 6px; border: 1px solid #b3d7ff; margin-bottom: 15px; color: #004085; line-height: 1.5; }

        #result-box { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-size: 16px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .olm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .profile-item { background: #fdfdfd; padding: 10px; border: 1px solid #eee; border-radius: 5px; }
        .profile-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        progress { width: 100%; height: 12px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top: 0; color: #222; border-bottom: 2px solid #f37021; padding-bottom: 10px;">AdaptMath Engine - {{ task.task_id }}</h2>

    <div class="task-box" id="task-content">
        Zadání: $$ {{ task.content_latex }} $$
    </div>

    <div class="form-group">
        <label for="student-answer">Tvoje odpověď (výsledek):</label>
        <input type="number" id="student-answer" step="0.01" placeholder="Zadej číselný výsledek...">
    </div>

    <div class="form-group">
        <label for="certainty">Úroveň jistoty (0 = hádám, 1 = vím to s jistotou):</label>
        <input type="range" id="certainty" min="0" max="1" step="0.1" value="0.5" oninput="document.getElementById('certainty-val').innerText = this.value">
        <span id="certainty-val" style="font-weight: bold; color: #f37021;">0.5</span>
    </div>

    <div id="hint-display" class="hint-box"></div>
    <button class="btn-hint" id="hint-button" onclick="fetchHint()">💡 Potřebuji poradit (Gemini 2.5 Flash)</button>

    <div class="checkbox-group">
        <input type="checkbox" id="used-hint">
        <label for="used-hint" style="margin: 0; cursor: pointer;">Využil jsem AI nápovědu (Sníží odměnu BKT)</label>
    </div>

    <button class="btn-main" onclick="submitAnswer()">Zkontrolovat a přepočítat BKT model</button>

    <div id="result-box"></div>

    <hr style="margin: 40px 0 20px 0; border-top: 1px solid #ddd;">

    <h3 style="color: #333; margin-bottom: 5px;">Kognitivní profil studenta (Open Learner Model)</h3>
    <div class="olm-grid">
        {% for topic, mastery in student.cognitive_profile.items() %}
            <div class="profile-item">
                <div class="profile-header">
                    <strong>{{ topic }}</strong>
                    <span id="val-{{ topic }}">{{ (mastery * 100)|round }} %</span>
                </div>
                <progress id="bar-{{ topic }}" value="{{ mastery }}" max="1"></progress>
            </div>
        {% endfor %}
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
            delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}]
        });
    });

    // FUNKCE PRO NÁPOVĚDU
    async function fetchHint() {
        const hintBtn = document.getElementById('hint-button');
        const hintDisplay = document.getElementById('hint-display');

        hintBtn.innerText = "⌛ Generuji nápovědu...";

        try {
            const res = await fetch('/get-hint', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({latex: "{{ task.content_latex }}"})
            });
            const data = await res.json();

            hintDisplay.innerText = data.hint;
            hintDisplay.style.display = 'block';
            hintBtn.innerText = "💡 Potřebuji poradit (Gemini 2.0 Flash)";

            // AUTOMATICKY ZAŠKRTNE CHECKBOX (pro BKT penalizaci)
            document.getElementById('used-hint').checked = true;
        } catch (e) {
            hintBtn.innerText = "❌ Chyba AI";
        }
    }

    // FUNKCE PRO EVALUACI
    async function submitAnswer() {
        const answer = document.getElementById('student-answer').value;
        const certainty = document.getElementById('certainty').value;
        const usedHint = document.getElementById('used-hint').checked;
        const resultBox = document.getElementById('result-box');

        if (answer === "") { alert("Zadej odpověď."); return; }

        resultBox.style.display = "block";
        resultBox.innerHTML = "⏳ Vyhodnocuji...";

        try {
            const response = await fetch('/evaluate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_id: "{{ student.student_id }}",
                    task_id: "{{ task.task_id }}",
                    student_answer: parseFloat(answer),
                    certainty: parseFloat(certainty),
                    used_hint: usedHint
                })
            });

            const data = await response.json();

            if (data.is_correct) {
                resultBox.className = "success";
                resultBox.innerHTML = `✅ <strong>Správně!</strong> BKT model aktualizován.`;
            } else {
                resultBox.className = "error";
                resultBox.innerHTML = `❌ <strong>Chyba!</strong> Správně je ${data.correct_answer}.`;
            }

            for (const [topic, mastery] of Object.entries(data.new_profile)) {
                const valElement = document.getElementById(`val-${topic}`);
                const barElement = document.getElementById(`bar-${topic}`);
                if (valElement) valElement.innerText = `${Math.round(mastery * 100)} %`;
                if (barElement) barElement.value = mastery;
            }
        } catch (error) {
            resultBox.innerHTML = "❌ Chyba spojení se serverem.";
        }
    }
</script>
</body>
</html>

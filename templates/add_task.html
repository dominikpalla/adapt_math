<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdaptMath - Přidat úlohu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f9; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-top: 0; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }

        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; font-family: monospace; }

        .preview-box { background: #f8f9fa; padding: 15px; border: 1px dashed #ccc; border-radius: 6px; margin-top: 5px; min-height: 50px; text-align: center; font-size: 1.2em; }

        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px; }
        button:hover { background: #0056b3; }
        .msg { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>➕ AdaptMath: Editor úloh</h2>

    <div class="form-grid">
        <div>
            <label>ID úlohy (Volitelné, vygeneruje se samo):</label>
            <input type="text" id="task_id" placeholder="např. lim_10_new">
        </div>
        <div>
            <label>Oblast znalostí (Kategorie):</label>
            <input type="text" id="graph_vector" value="Limity funkcí">
        </div>

        <div class="full-width">
            <label>Textové zadání (Otázka / Slovní popis):</label>
            <textarea id="task_description" placeholder="např. Vypočítejte následující limitu pro x blížící se nule:"></textarea>
        </div>

        <div class="full-width">
            <label>Zadání (LaTeX kód):</label>
            <textarea id="content_latex" placeholder="např. \lim_{x \to 0} \frac{\sin(x)}{x}"></textarea>
            <label style="margin-top: 10px;">Živý náhled:</label>
            <div id="latex-preview" class="preview-box"></div>
        </div>

        <div>
            <label>Typ výsledku:</label>
            <select id="result_type">
                <option value="decimal">Desetinné číslo (Decimal)</option>
                <option value="multiple_choice">Výběr z možností (Multiple Choice)</option>
                <option value="fraction">Zlomek (Fraction)</option>
                <option value="word">Slovní (Text)</option>
            </select>
        </div>
        <div>
            <label>Správná odpověď:</label>
            <input type="text" id="correct_answer" placeholder="např. 1.0">
        </div>

        <div>
            <label>Tolerance chyby (pro desetinná čísla):</label>
            <input type="number" id="tolerance" step="0.01" value="0.01">
        </div>
        <div>
            <label>Kognitivní náročnost (A-F):</label>
            <select id="cognitive_load">
                <option value="A">A - Velmi nízká</option>
                <option value="B">B - Nízká</option>
                <option value="C" selected>C - Střední</option>
                <option value="D">D - Vyšší</option>
                <option value="E">E - Vysoká</option>
                <option value="F">F - Extrémní</option>
            </select>
        </div>

        <div>
            <label>Obtížnost IRT (b):</label>
            <input type="number" id="irt_difficulty" step="0.1" value="0.0">
        </div>
        <div>
            <label>Diskriminace IRT (a):</label>
            <input type="number" id="irt_discrimination" step="0.1" value="1.0">
        </div>
    </div>

    <button onclick="submitTask()">Uložit úlohu do databáze</button>
    <div id="status-msg" class="msg"></div>
</div>

<script>
    // Živý náhled LaTeXu
    const latexInput = document.getElementById('content_latex');
    const previewBox = document.getElementById('latex-preview');

    latexInput.addEventListener('input', function() {
        try {
            katex.render(this.value, previewBox, { displayMode: true, throwOnError: false });
        } catch (e) {
            previewBox.innerText = "Chyba syntaxe";
        }
    });

    // Odeslání do API
    async function submitTask() {
        const msgBox = document.getElementById('status-msg');
        msgBox.innerHTML = "⏳ Ukládám...";
        msgBox.style.color = "gray";

        const data = {
            task_id: document.getElementById('task_id').value,
            graph_vector: document.getElementById('graph_vector').value,
            content_latex: document.getElementById('content_latex').value,
            result_type: document.getElementById('result_type').value,
            correct_answer: document.getElementById('correct_answer').value,
            tolerance: document.getElementById('tolerance').value,
            cognitive_load: document.getElementById('cognitive_load').value,
            irt_difficulty: document.getElementById('irt_difficulty').value,
            irt_discrimination: document.getElementById('irt_discrimination').value
        };

        try {
            const res = await fetch('/admin/add-task', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();

            if (res.ok) {
                msgBox.innerHTML = result.message;
                msgBox.style.color = "green";
                // Vyčištění formuláře
                document.getElementById('content_latex').value = "";
                document.getElementById('correct_answer').value = "";
                previewBox.innerHTML = "";
                document.getElementById('task_id').value = "";
            } else {
                msgBox.innerHTML = result.error;
                msgBox.style.color = "red";
            }
        } catch (e) {
            msgBox.innerHTML = "❌ Chyba připojení k serveru.";
            msgBox.style.color = "red";
        }
    }
</script>

</body>
</html>
